<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi-Subtitles for YouTube</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #e8e8e8;
      width: 300px;
      padding: 16px;
    }
    h1 {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h1::before {
      content: "▶";
      color: #ff0000;
    }
    #status {
      font-size: 12px;
      color: #aaa;
      margin-bottom: 12px;
      min-height: 18px;
    }
    #track-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .track-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(255,255,255,0.06);
      cursor: pointer;
      font-size: 12px;
      transition: background 0.15s;
    }
    .track-item:hover {
      background: rgba(255,255,255,0.12);
    }
    .track-item input[type="checkbox"] {
      cursor: pointer;
      accent-color: #ff0000;
    }
    .track-badge {
      margin-left: auto;
      font-size: 10px;
      color: #888;
      background: rgba(255,255,255,0.08);
      padding: 1px 5px;
      border-radius: 8px;
    }
    #no-tracks {
      font-size: 12px;
      color: #888;
      text-align: center;
      padding: 20px 0;
      display: none;
    }
    footer {
      margin-top: 14px;
      font-size: 10px;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Multi-Subtitles for YouTube</h1>
  <div id="status">Loading tracks…</div>
  <div id="track-list"></div>
  <div id="no-tracks">No subtitle tracks found.<br/>Open a YouTube video first.</div>
  <footer>Manifest V3 · garywill VTT fix</footer>
  <script src="popup.js"></script>
</body>
</html>
